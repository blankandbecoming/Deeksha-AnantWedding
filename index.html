<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Wedding Invitation</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #411e60;
        }

        #siteFrame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Global Persistent Audio Player -->
    <audio id="globalMusic" preload="auto" playsinline loop>
        <source src="thousandyears.mp3" type="audio/mpeg">
    </audio>

    <!-- Main Content Frame -->
    <iframe id="siteFrame" src="home.html" name="siteFrame"></iframe>

    <script>
        const globalAudio = document.getElementById('globalMusic');

        function startMusic() {
            if (globalAudio) {
                if (globalAudio.paused) {
                    globalAudio.currentTime = 17;
                    const playPromise = globalAudio.play();
                    
                    if (playPromise !== undefined) {
                        playPromise.catch(err => {
                            console.log("Autoplay policy blocked playback. Waiting for tap...", err);
                            const unlock = () => {
                                globalAudio.currentTime = 17;
                                globalAudio.play();
                                window.removeEventListener('click', unlock);
                                window.removeEventListener('touchstart', unlock);
                            };
                            window.addEventListener('click', unlock, { once: true });
                            window.addEventListener('touchstart', unlock, { once: true });
                        });
                    }
                }
            }
        }

        // Expose function globally
        window.startMusic = startMusic;

        // Listen for postMessage from iframe
        window.addEventListener('message', (event) => {
            if (event.data === 'play_wedding_music' || (event.data && event.data.type === 'play_wedding_music')) {
                startMusic();
            }
        });
    </script>
</body>
</html>
