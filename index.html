<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Wedding Invitation</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #411e60;
        }

        #siteFrame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Global Audio Player (Never reloads on frame navigation) -->
    <audio id="globalMusic" preload="auto" playsinline loop>
        <source src="thousandyears.mp3" type="audio/mpeg">
    </audio>

    <!-- Main Navigation Frame -->
    <iframe id="siteFrame" src="home_2.html" name="siteFrame"></iframe>

    <script>
        const globalAudio = document.getElementById('globalMusic');

        function startMusic() {
            if (globalAudio) {
                if (globalAudio.paused) {
                    globalAudio.currentTime = 17;
                    globalAudio.play().catch(err => {
                        console.log("Audio play blocked by browser policy. Unlocking on next interaction:", err);
                        const unlock = () => {
                            globalAudio.play();
                            window.removeEventListener('click', unlock);
                            window.removeEventListener('touchstart', unlock);
                        };
                        window.addEventListener('click', unlock);
                        window.addEventListener('touchstart', unlock);
                    });
                }
            }
        }

        // Listen for messages from inside child pages inside the iframe
        window.addEventListener('message', (event) => {
            if (event.data === 'play_wedding_music') {
                startMusic();
            }
        });
    </script>
</body>
</html>
